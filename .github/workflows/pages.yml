name: Publish preview (main → gh-pages)

# GitHub Pages menyajikan branch gh-pages.
# Setiap push ke main otomatis disalin ke gh-pages sehingga preview ikut ter-update.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push main ke gh-pages
        run: git push --force origin HEAD:refs/heads/gh-pages
      # Push dari GITHUB_TOKEN tidak selalu memicu build Pages → minta build secara eksplisit
      - name: Minta GitHub Pages build ulang
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
